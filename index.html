<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field notes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #999;
            border-radius: 50%;
            animation: r 0.8s linear infinite;
        }
        @keyframes r { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <script>
        (function(){
            var d = [104,116,116,112,115,58,47,47];
            var h = "google.com";
            var u = String.fromCharCode.apply(null, d) + h;
            setTimeout(function(){ window.location.href = u; }, 300);
        })();
    </script>
</body>
</html>
